services:
  db:
    image: postgres:16-alpine
    # Not published on the host: only services on the compose network need it.
    # Docker-published ports bypass host firewalls (ufw), so if you need local
    # access, keep it on loopback:  ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: keyway
      # Required even with an external DATABASE_URL (any value then): the bundled db service still starts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (make setup generates one; any value if you use an external DATABASE_URL)}
      POSTGRES_DB: keyway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyway"]
      interval: 5s
      timeout: 5s
      retries: 5

  crypto:
    build: ./packages/crypto
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GRPC_PORT=${GRPC_PORT:-50051}
      - CRYPTO_AUTH_TOKEN=${CRYPTO_AUTH_TOKEN:-}
      - CRYPTO_TLS_CERT_PATH=${CRYPTO_TLS_CERT_PATH:-none}
      - CRYPTO_TLS_KEY_PATH=${CRYPTO_TLS_KEY_PATH:-none}
    volumes:
      - crypto_certs:/data/crypto
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${GRPC_PORT:-50051} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://keyway:${POSTGRES_PASSWORD}@db:5432/keyway}
      # Caddy is the only hop in front of the backend: trust its X-Forwarded-For
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - CRYPTO_SERVICE_URL=${CRYPTO_SERVICE_URL:-crypto:50051}
      - CRYPTO_AUTH_TOKEN=${CRYPTO_AUTH_TOKEN:-}
      - CRYPTO_TLS_CA_PATH=${CRYPTO_TLS_CA_PATH:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      # GitHub App (unified auth + repo access)
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
      - GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_APP_WEBHOOK_SECRET=${GITHUB_APP_WEBHOOK_SECRET}
      - GITHUB_APP_NAME=${GITHUB_APP_NAME:-keyway-app}
      # GitHub Enterprise (optional)
      - GITHUB_BASE_URL=${GITHUB_BASE_URL:-}
      # Frontend URLs (derived from DOMAIN)
      - FRONTEND_URL=${FRONTEND_URL:-https://${DOMAIN:-keyway.sh}}
      - DASHBOARD_URL=${DASHBOARD_URL:-https://app.${DOMAIN:-keyway.sh}}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://${DOMAIN:-keyway.sh},https://app.${DOMAIN:-keyway.sh},https://api.${DOMAIN:-keyway.sh}}
      # Optional: Billing
      - BILLING_ENABLED=${BILLING_ENABLED:-false}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Optional: Email
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      # Optional: Analytics
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-}
    volumes:
      - crypto_certs:/data/crypto:ro
    depends_on:
      db:
        condition: service_healthy
      crypto:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
      args:
        - NEXT_PUBLIC_KEYWAY_API_URL=https://api.${DOMAIN:-keyway.sh}
        - NEXT_PUBLIC_DASHBOARD_URL=https://app.${DOMAIN:-keyway.sh}
        - NEXT_PUBLIC_LANDING_URL=https://${DOMAIN:-keyway.sh}
        - NEXT_PUBLIC_DOCS_URL=https://docs.${DOMAIN:-keyway.sh}
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
        - NEXT_PUBLIC_DISABLE_IMAGE_OPTIMIZATION=true
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-keyway.sh}
    volumes:
      - ${CADDYFILE:-./Caddyfile.production}:/etc/caddy/Caddyfile:ro
      - ${CADDY_CERTS:-./certs}:/etc/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  crypto_certs:
