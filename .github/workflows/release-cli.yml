name: "Release: CLI"

on:
  push:
    tags:
      - "cli/v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/cli/go.mod

      - name: Extract version from tag
        id: version
        run: |
          # Tag is cli/v1.2.3 or cli/v1.2.3-rc.1
          VERSION="${GITHUB_REF_NAME#cli/v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not cli/vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create local vX.Y.Z tag for GoReleaser
        # GoReleaser OSS only understands vX.Y.Z tags and validates that the
        # tag points at HEAD. This tag is never pushed: the GitHub release is
        # published under the cli/v* tag by the steps below.
        run: git tag "v${{ steps.version.outputs.version }}"

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: release --clean --skip=publish,announce
          workdir: packages/cli
        env:
          GORELEASER_CURRENT_TAG: "v${{ steps.version.outputs.version }}"

      - name: Verify Go toolchain of built binaries
        run: sh scripts/check_toolchain.sh go.mod dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${FLAGS[@]}" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt

      # The tap update runs in its own job from this exact formula, so a tap
      # failure neither blocks npm nor forces a rebuild (new archives would no
      # longer match the published sha256s).
      - name: Upload Homebrew formula
        if: steps.version.outputs.prerelease == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: packages/cli/dist/homebrew/Formula/keyway.rb
          if-no-files-found: error
          retention-days: 30

  homebrew:
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Homebrew formula
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: packages/cli/dist/homebrew/Formula

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: sh scripts/update_tap.sh dist/homebrew/Formula/keyway.rb "${{ needs.release.outputs.version }}"

  publish-npm:
    needs: release
    # npm trusted publishing only supports GitHub-hosted runners.
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        run: npm install -g npm@11.7.0

      - name: Copy README to npm
        run: cp README.md npm/README.md

      - name: Set package version
        working-directory: packages/cli/npm
        run: npm version "${{ needs.release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: packages/cli/npm
        run: |
          if [[ "${{ needs.release.outputs.prerelease }}" == "true" ]]; then
            npm publish --access public --provenance --tag beta
          else
            npm publish --access public --provenance
          fi
