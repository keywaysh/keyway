version: 2

project_name: keyway

before:
  hooks:
    - go mod tidy

builds:
  - id: keyway
    main: ./cmd/keyway
    binary: keyway
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  # Published by the release workflow under the cli/v* tag: GoReleaser OSS can
  # only publish under GORELEASER_CURRENT_TAG (vX.Y.Z).
  disable: true

brews:
  - name: keyway
    # The workflow pushes the generated formula to the tap after the release exists.
    skip_upload: true
    url_template: "https://github.com/keywaysh/keyway/releases/download/cli%2Fv{{ .Version }}/{{ .ArtifactName }}"
    homepage: https://keyway.sh
    description: "GitHub-native secrets management CLI"
    license: "MIT"
    repository:
      owner: keywaysh
      name: homebrew-tap
    commit_author:
      name: keywaysh-bot
      email: bot@keyway.sh
    directory: Formula
    install: |
      bin.install "keyway"
    test: |
      system "#{bin}/keyway", "--version"
